<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game 2D - Google Sheets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-screen" class="card">
    <h2>Game Jump 2D</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <div class="btn-group">
      <button onclick="login()">Login</button>
      <button onclick="register()">Daftar</button>
    </div>
    <p id="auth-msg"></p>
  </div>

  <div id="game-screen" class="hidden">
    <div class="info-bar">
      <span>Pemain: <strong id="player-name"></strong></span>
      <span>Skor: <strong id="score">0</strong></span>
    </div>
    <canvas id="gameCanvas" width="600" height="200"></canvas>
    <p><small>Tekan <strong>SPASI</strong> untuk melompat</small></p>

    <div class="leaderboard-box">
      <h3>5 Skor Tertinggi</h3>
      <ol id="leaderboard-list"></ol>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
