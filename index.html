<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coin Catcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <section id="loginPage" class="page">

        <div class="card">

            <h1>🪙 Coin Catcher</h1>

            <p class="subtitle">
                Tangkap koin sebanyak mungkin!
            </p>

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button onclick="login()">
                MASUK
            </button>

            <button class="secondary" onclick="showRegister()">
                DAFTAR AKUN
            </button>

            <p id="loginMessage" class="message"></p>

        </div>

    </section>


    <!-- REGISTER -->
    <section id="registerPage" class="page hidden">

        <div class="card">

            <h1>Daftar Akun</h1>

            <input
                type="text"
                id="regUsername"
                placeholder="Username"
            >

            <input
                type="password"
                id="regPassword"
                placeholder="Password"
            >

            <input
                type="password"
                id="regPassword2"
                placeholder="Ulangi Password"
            >

            <button onclick="register()">
                BUAT AKUN
            </button>

            <button class="secondary" onclick="showLogin()">
                KEMBALI
            </button>

            <p id="registerMessage" class="message"></p>

        </div>

    </section>


    <!-- MENU -->
    <section id="menuPage" class="page hidden">

        <div class="card">

            <h1>🪙 Coin Catcher</h1>

            <p>
                Halo, <b id="playerName"></b>
            </p>

            <button onclick="startGame()">
                ▶ MULAI GAME
            </button>

            <button onclick="showLeaderboard()">
                🏆 LEADERBOARD
            </button>

            <button class="secondary" onclick="logout()">
                KELUAR
            </button>

        </div>

    </section>


    <!-- GAME -->
    <section id="gamePage" class="page hidden">

        <div class="gameHeader">

            <span>
                Pemain:
                <b id="gamePlayer"></b>
            </span>

            <span>
                Skor:
                <b id="score">0</b>
            </span>

        </div>

        <canvas id="gameCanvas"></canvas>

        <p class="gameInstruction">
            Gunakan tombol ← → atau sentuh layar untuk bergerak.
            Tangkap koin!
        </p>

        <button class="secondary" onclick="endGame()">
            KELUAR GAME
        </button>

    </section>


    <!-- LEADERBOARD -->
    <section id="leaderboardPage" class="page hidden">

        <div class="card leaderboardCard">

            <h1>🏆 Leaderboard</h1>

            <div id="leaderboard">
                Memuat data...
            </div>

            <button onclick="showMenu()">
                KEMBALI
            </button>

        </div>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
